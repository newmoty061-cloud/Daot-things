name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the source zip
        run: |
          unzip -o daot-limbs-source-updated.zip -x ".github/*"
          echo "Java files:"; find . -name "*.java" | wc -l

      - name: Fix plugin repositories and Loom version
        run: |
          echo "pluginManagement { repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          sed -i "s/1.8-SNAPSHOT/1.8.13/" build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: daot-limbs-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
